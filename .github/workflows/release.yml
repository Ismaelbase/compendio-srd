# Al subir una etiqueta (la version, sin "v"), GitHub compila el plugin, firma los ficheros (attestation) y crea la
# version con main.js, manifest.json y styles.css. Las notas de la version salen de notas/<version>.md.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check version
        run: |
          test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file "notas/$GITHUB_REF_NAME.md"
